# HANDOFF: daily sum of authoritative source units; no accounting bridge declared.
# NEXT: declare source keys, calendar, coverage, comparison and returns policy.
# CHECK: distinguish absent records from zero sales; decide whether signed return
# quantities belong in this metric before enabling nonnegative data validation.

# Identity and current calculation metadata.
schema_version: 1
kpi_id: units_sold
version: 1
display_name: Units sold
status: ACTIVE
definition: Daily units sold recorded in sales_daily, summed across the requested slice.
business_purpose: Monitor physical unit volume separately from order count and revenue.
steward: Operations data steward
tags: [funnel, units, daily]
value_column: units_sold
aggregation: sum
formula: units_sold
unit: units
precision: 2
aggregation_notes: [Sum recorded unit quantity; absent source rows are not assumed to mean zero.]
grain: daily
source: sales_daily
dimensions: [region, category]
supported_rollups: [region, category, month]
calendar: Gregorian
timezone: UTC
null_policy: reject incomplete primary observations
zero_policy: recorded zero remains zero; missing observations are not imputed
calculation:
  operator: sum
  value_column: units_sold
  formula: units_sold
comparison_policy:
  period: same_slice_closed_month_only
  weighting: none
  completeness: required

# Dataset-specific provisional alert thresholds.
materiality:
  z_threshold: 2.05
  abs_threshold: 10.0
  rel_threshold: 0.10 # Stage 2 (F-D3): a slice-relative gate alongside the absolute floor.
statistical_method: robust rolling baseline z-score with seasonal MSTL review
detector_agreement_rule: materially alert on the robust detector; seasonal-only movement is review-only
threshold_status: PROVISIONAL
calibration_reference: null
seasonal_period: 7
min_history_periods: 60
owner: operations_lead
access_tags: [region_scoped]
# Stage 2 (F-D4): cross-KPI movement-priority weight and revenue-equivalent impact.
kpi_weight: 0.6
impact_to_revenue: {method: aov, rate_column: aov}

# No second-source comparison or quantity/rate identity currently configured.
decomposition: null
reconciliation: null
driver_method: native-grain first-difference lagged Pearson association; ranking index is exploratory
driver_limitations: [No multiple-testing correction, no seasonal adjustment, marginal associations do not separate interacting drivers, correlation is not contribution or causation.]
decomposition_limitations: [No accounting decomposition is currently configured.]
source_catalog_version: "1"
policy_reference: data/access_control.csv

# traffic_online/traffic_instore/traffic_wholesale are funnel components that
# mechanically move with this KPI (F-R2); never candidate drivers here. They
# are reported through the funnel/accounting bridge (Stage 3), not ranked.
mechanical_components: [traffic_online, traffic_instore, traffic_wholesale]

# NEXT: resolve driver source/column and analysis policy through the catalog.
# Driver ids name the variable, not the event (F-R5); LEGACY_DRIVER_IDS in
# kpi_engine/contracts/registry.py resolves the pre-rename spelling.
candidate_drivers:
  - {id: checkout_latency, display_name: Checkout latency, unit: ms, controllability: controllable, column: checkout_latency_ms, source: sales_daily, grain: daily, aggregation: mean, allowed_lags: [0, 1, 2, 3, 4, 5, 6, 7], min_pairs: 14, minimum_coverage: 0.6, expected_direction: negative, owner: engineering_lead}
  - {id: competitor_price_index, display_name: Competitor price index, unit: index, controllability: contextual, column: competitor_price_index, source: sales_daily, grain: daily, aggregation: mean, allowed_lags: [0, 1, 2, 3, 4, 5, 6, 7], min_pairs: 14, minimum_coverage: 0.6, expected_direction: positive, owner: pricing_lead}
  - {id: marketing_spend, display_name: Marketing spend, unit: INR/week, controllability: controllable, column: marketing_spend, source: marketing_weekly, grain: weekly, aggregation: sum, allowed_lags: [0, 7], min_pairs: 8, minimum_coverage: 0.6, expected_direction: positive, owner: marketing_lead}
  - {id: stock_availability, display_name: Stock availability, unit: share_in_stock, controllability: controllable, column: stock_availability, source: sales_daily, grain: daily, aggregation: mean, allowed_lags: [0, 1, 2, 3], min_pairs: 14, minimum_coverage: 0.6, expected_direction: positive, owner: operations_lead}
  - {id: price_discount, display_name: Price discount depth, unit: fraction, controllability: controllable, column: price_discount_depth, source: sales_daily, grain: daily, aggregation: mean, allowed_lags: [0, 1, 2, 3, 4, 5, 6, 7], min_pairs: 14, minimum_coverage: 0.6, expected_direction: positive, owner: pricing_lead}
  - {id: promo_flag, display_name: Promotion flag, unit: flag, controllability: controllable, column: promo_flag, source: sales_daily, grain: daily, aggregation: mean, allowed_lags: [0, 1, 2, 3, 4, 5, 6, 7], min_pairs: 14, minimum_coverage: 0.6, expected_direction: positive, owner: pricing_lead}
  - {id: weather_temp, display_name: Weather temperature, unit: celsius, controllability: contextual, column: weather_temp_c, source: sales_daily, grain: daily, aggregation: mean, allowed_lags: [0, 1, 2, 3, 4, 5, 6, 7], min_pairs: 14, minimum_coverage: 0.6, expected_direction_by_scope: {category: {Apparel: negative}}, owner: merchandising_lead}
