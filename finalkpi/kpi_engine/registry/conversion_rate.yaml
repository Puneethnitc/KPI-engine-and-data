kpi_id: conversion_rate
version: 1
definition: Daily orders divided by total traffic for the requested slice; calculated from source numerators and denominators, not averaged displayed rates.
value_column: conversion_rate
aggregation: ratio_of_sums
numerator_column: orders
denominator_column: traffic_total
formula: orders / traffic_total
unit: orders_per_visit
grain: daily
source: sales_daily
dimensions: [region, category]
materiality:
  z_threshold: 2.5
  abs_threshold: 0.003
seasonal_period: 7
min_history_periods: 60
owner: growth_lead
access_tags: [region_scoped]
decomposition: null
reconciliation: null
candidate_drivers:
  - {id: checkout_latency_spike, column: checkout_latency_ms, source: sales_daily, grain: daily, aggregation: mean}
  - {id: competitor_price_cut, column: competitor_price_index, source: sales_daily, grain: daily, aggregation: mean}
  - {id: ad_spend_drop, column: marketing_spend, source: marketing_weekly, grain: weekly, aggregation: sum}
  - {id: stockout, column: lost_units_stockout, source: sales_daily, grain: daily, aggregation: sum}
