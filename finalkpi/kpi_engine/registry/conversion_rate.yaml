# HANDOFF: ratio of summed orders to summed traffic, in orders_per_visit units.
# NEXT: declare paired-null/coverage and denominator policies; keep ratio_of_sums
# at every rollup. A 0.003 absolute change is 0.3 percentage points, not 0.3%.
# CHECK: unequal traffic across segments, zero/negative denominators, missing
# components and weekly rollups. Ratio decomposition is currently unsupported.

# Executable inputs today are aggregation/numerator/denominator, not formula text.
schema_version: 1
kpi_id: conversion_rate
version: 1
display_name: Conversion rate
status: ACTIVE
definition: Daily orders divided by total traffic for the requested slice; calculated from source numerators and denominators, not averaged displayed rates.
business_purpose: Measure orders per visit using additive source components at every supported rollup.
steward: Growth data steward
tags: [funnel, conversion, daily]
value_column: conversion_rate
aggregation: ratio_of_sums
numerator_column: orders
denominator_column: traffic_total
formula: orders / traffic_total
unit: orders_per_visit
precision: 4
aggregation_notes: [Ratio of summed orders to summed traffic; never average displayed daily rates.]
grain: daily
source: sales_daily
dimensions: [region, category]
supported_rollups: [region, category, month]
calendar: Gregorian
timezone: UTC
null_policy: require both numerator and denominator
zero_policy: zero denominator is missing, never zero conversion
calculation:
  operator: ratio_of_sums
  numerator_column: orders
  denominator_column: traffic_total
  formula: orders / traffic_total
comparison_policy:
  period: same_slice_closed_month_only
  weighting: none
  completeness: required

# Thresholds use the fraction scale; presentation percentages are separate.
materiality:
  z_threshold: 2.5
  abs_threshold: 0.003
statistical_method: robust rolling baseline z-score with seasonal MSTL review
detector_agreement_rule: materially alert on the robust detector; seasonal-only movement is review-only
threshold_status: PROVISIONAL
calibration_reference: null
seasonal_period: 7
min_history_periods: 60
owner: growth_lead
access_tags: [region_scoped]

# Explicit unsupported/not-declared capabilities, not successful empty results.
decomposition: null
reconciliation: null
driver_method: native-grain first-difference lagged Pearson association; ranking index is exploratory
driver_limitations: [No multiple-testing correction, no seasonal adjustment, marginal associations do not separate interacting drivers, correlation is not contribution or causation.]
decomposition_limitations: [Ratio-of-sums KPIs do not use the additive product decomposition.]
source_catalog_version: "1"
policy_reference: data/access_control.csv

# Associations only; future driver means may require volume weights.
candidate_drivers:
  - {id: checkout_latency_spike, display_name: Checkout latency, unit: ms, controllability: controllable, column: checkout_latency_ms, source: sales_daily, grain: daily, aggregation: mean, allowed_lags: [0, 1, 2, 3, 4, 5, 6, 7], min_pairs: 14, minimum_coverage: 0.6}
  - {id: competitor_price_cut, display_name: Competitor price index, unit: index, controllability: contextual, column: competitor_price_index, source: sales_daily, grain: daily, aggregation: mean, allowed_lags: [0, 1, 2, 3, 4, 5, 6, 7], min_pairs: 14, minimum_coverage: 0.6}
  - {id: ad_spend_drop, display_name: Marketing spend, unit: INR/week, controllability: controllable, column: marketing_spend, source: marketing_weekly, grain: weekly, aggregation: sum, allowed_lags: [0, 7], min_pairs: 8, minimum_coverage: 0.6}
  - {id: stockout, display_name: Stockout units, unit: units/day, controllability: controllable, column: lost_units_stockout, source: sales_daily, grain: daily, aggregation: sum, allowed_lags: [0, 1, 2, 3, 4, 5, 6, 7], min_pairs: 14, minimum_coverage: 0.6}
