[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "finalkpi"
version = "0.1.0"
description = "As-of KPI movement assessment with source and access gates"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "PyYAML>=6.0",
    "statsmodels>=0.14",
]

[tool.setuptools.packages.find]
include = ["kpi_engine*"]

[tool.setuptools.package-data]
kpi_engine = ["registry/*.yaml"]
