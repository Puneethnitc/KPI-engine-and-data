[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "finalkpi"
version = "0.1.0"
description = "As-of KPI movement assessment with source and access gates"
requires-python = ">=3.10"
dependencies = [
    "duckdb==1.1.3",
    "numpy>=1.24",
    "pandas>=2.0",
    "PyYAML>=6.0",
    "statsmodels>=0.14",
    "fastapi>=0.115,<1",
    "pydantic>=2.9,<3",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
rag = [
    "chromadb>=0.5,<1",
    "openai>=1.50,<2",
]
dev = [
    "httpx>=0.27,<1",
]

[tool.setuptools.packages.find]
include = ["kpi_engine*"]

[tool.setuptools.package-data]
kpi_engine = ["registry/*.yaml"]
